iconsBrand: (this.props.iconStyle ?? 'brand') === 'brand',
iconsClay: (this.props.iconStyle ?? 'brand') === 'clay',
iconsChrome: (this.props.iconStyle ?? 'brand') === 'chrome',
accent: this.props.accent ?? '#3355F0',
open: this.state.search,
closed: !this.state.search,
sxClass: this.state.closing ? 'sx sx-closing' : 'sx',
searchWrap: 'display: flex; flex: none; transition: width .32s cubic-bezier(.2,.8,.2,1); width: ' + ((this.state.focused || this.state.query) ? '360px' : '56px'),
ph: 'Введите название услуги',
fieldStyle: 'flex: 1; min-width: 0; height: 56px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; overflow: hidden; cursor: text; padding: 0 ' + ((this.state.focused || this.state.query) ? '8px 0 18px; gap: 10px' : '18px; gap: 0') + '; transition: box-shadow .2s; box-shadow: ' + (this.state.focused ? '0 0 0 2px ' + (this.props.accent ?? '#3355F0') : 'inset 0 0 0 1px #E4E2DC'),
query: this.state.query,
hasQuery: this.state.query.length > 0,
...this.filter(),
openSearch: () => this.setState({ search: true, closing: false }),
closeSearch: () => this.collapse(),
clearQuery: () => { this.setState({ query: '' }); if (this.inputEl) this.inputEl.focus(); },
keepFocus: (e) => e.preventDefault(),
onInput: (e) => this.setState({ query: e.target.value }),
onFocus: () => { clearTimeout(this.blurT); this.setState({ focused: true }); },
onBlur: () => this.setState({ focused: false }),
setInput: (el) => { this.inputEl = el; },
onKey: (e) => { if (e.key === 'Escape') { this.setState({ query: '' }); if (this.inputEl) this.inputEl.blur(); } if (e.key === 'Enter' && this.inputEl) this.inputEl.blur(); }
};
}
}
</script>
