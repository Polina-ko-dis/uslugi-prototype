<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Категория Баня — планшет</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hs{scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
@keyframes sx-open{from{clip-path:inset(0 0 0 calc(100% - 52px) round 999px)}to{clip-path:inset(0 0 0 0 round 999px)}}
.sx{animation:sx-open .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sx-close{from{clip-path:inset(0 0 0 0 round 999px);opacity:1}to{clip-path:inset(0 0 0 calc(100% - 52px) round 999px);opacity:0.4}}
.sx.sx-closing{animation:sx-close .22s cubic-bezier(.4,0,.6,1) forwards}
.sx input::placeholder{color:#7A7C82}
.chip{transition:transform .2s ease,box-shadow .2s ease}
.chip:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(21,22,26,0.08)}
.chip:active{transform:scale(0.97)}
.chip .ic{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.chip:hover .ic{transform:scale(1.08) rotate(-8deg)}
.chip:focus-visible{outline:2px solid #15161A;outline-offset:2px}
.card{transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(21,22,26,0.10)}
@keyframes ov-in{from{opacity:0}to{opacity:1}}
@keyframes dlg-in{from{transform:translate(-50%,-48%) scale(.97);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
@keyframes drw-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.ov{animation:ov-in .25s ease-out both}
.dlg{animation:dlg-in .3s cubic-bezier(.2,.8,.2,1) both}
.drw{animation:drw-in .32s cubic-bezier(.2,.8,.2,1) both}
textarea::placeholder{color:#7A7C82}
</style>
<style>html,body{height:100%;margin:0}#app{height:100vh;height:100dvh;overflow:hidden}dc-host{display:contents}section[aria-label="Состав заказа"]>div:last-child{border-bottom:0!important}</style>
</head>
<body>
<div id="app"></div>
<template data-dc="CategoryTablet">
<div style="width: 100%; height: 100%; position: relative; overflow: hidden; background: #F4F3EF; font-family: 'Onest', system-ui, sans-serif; color: #15161A">
<div class="hs" style="height: 100%; overflow-y: auto; padding-bottom: 48px; box-sizing: border-box">
<header style="position: relative; z-index: 5; display: flex; flex-direction: column; padding: 14px 0; background: #FFFFFF; border-bottom: 1px solid #EDEBE6; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 32px">
<a href="MainTablet.html" aria-label="Cosmos Москва ВДНХ — на главную" style="display: flex; align-items: center; height: 44px"><img src="assets/e61c0e74ae9b8b9fc548604cdf741b10.png" alt="Cosmos Москва ВДНХ" style="height: 34px; width: auto; display: block"></a>
<div style="display: flex; gap: 8px">
<sc-if value="{{hasCart}}"><a href="{{cartHref}}" aria-label="{{cartAria}}" style="height: 44px; padding: 0 16px 0 6px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(51,85,240,0.25)"><span style="height: 32px; padding: 0 10px 0 8px; border-radius: 999px; background: rgba(255,255,255,0.18); display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>{{cartCount}}</span>{{cartTotal}}</a></sc-if>
<button type="button" onClick="{{toggleMenu}}" aria-haspopup="true" aria-expanded="{{menuExpanded}}" aria-label="Язык и валюта" style="{{globeStyle}}"><span>{{langCode}} · {{curSym}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{chevStyle}}"><path d="M6 9l6 6 6-6"></path></svg></button>
<a href="#login" style="height: 44px; padding: 0 14px 0 12px; border-radius: 999px; background: #F4F3EF; color: #15161A; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Войти</a>
</div>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Язык и валюта" style="position: absolute; z-index: 30; top: 68px; right: 32px; width: 340px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px; box-shadow: 0 18px 48px rgba(21,22,26,0.18), 0 0 0 1px rgba(21,22,26,0.05); padding: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 10px 12px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #63656B">Валюта</span>
<sc-for list="{{curs}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}"><span style="width: 28px; height: 28px; border-radius: 999px; background: #F4F3EF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{c.sym}}</span><span style="flex: 1">{{c.code}}</span><sc-if value="{{c.sel}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></sc-if></button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #EEECE7; padding-left: 4px">
<span style="padding: 10px 12px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #63656B">Язык</span>
<sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
<button type="button" onClick="{{l.pick}}" style="{{l.style}}"><span style="flex: 1">{{l.name}}</span><sc-if value="{{l.sel}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></sc-if></button>
</sc-for>
</div>
</div>
</sc-if>
</header>
<section style="padding: 28px 32px 0; display: flex; align-items: center; gap: 12px">
<a href="{{homeHref}}" aria-label="Назад к услугам" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #15161A; border: 1px solid #E4E2DC; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em">{{catName}}</h1>
</section>
<sc-if value="{{hasFilters}}"><div role="group" aria-label="Фильтр" style="display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 32px 0">
<sc-for list="{{filters}}" as="fl" hint-placeholder-count="3">
<button type="button" onClick="{{fl.pick}}" aria-pressed="{{fl.pressed}}" style="{{fl.style}}">{{fl.label}}</button>
</sc-for>
</div></sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 20px 32px 0">
<sc-for list="{{items}}" as="it">
<article class="card" style="background: #FFFFFF; border-radius: 24px; padding: 0 0 8px; overflow: hidden; display: flex; flex-direction: column; gap: 10px">
<a aria-label="{{it.name}}" href="{{it.href}}" style="position: relative; display: block; height: 190px; border-radius: 0; overflow: hidden; background: #2B2F36">
<img alt="" src="{{it.img}}" style="width: 100%; height: 100%; object-fit: cover; display: block"/><sc-if value="{{it.inCart}}"><span style="position: absolute; inset: 0; background: rgba(21,22,26,0.42)"></span><span style="position: absolute; top: 10px; left: 10px; height: 28px; padding: 0 10px 0 6px; border-radius: 999px; background: rgba(255,255,255,0.92); color: #15161A; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600"><svg aria-hidden="true" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="16"><path d="M20 6L9 17l-5-5"></path></svg>В корзине: {{it.inCartQty}}</span></sc-if>
<span style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px"><span style="height: 3px; border-radius: 2px; background: #FFFFFF"></span><span style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.45)"></span><span style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.45)"></span><span style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.45)"></span></span>
</a>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 2px 14px 0">
<a href="{{it.href}}" style="font-size: 15px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{it.name}}</a>
<div style="display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: #63656B">
<sc-if value="{{it.guests}}"><span style="display: flex; align-items: center; gap: 5px"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="14"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>{{it.guests}}</span></sc-if>
<sc-if value="{{it.duration}}"><span style="display: flex; align-items: center; gap: 5px"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="14"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{it.duration}}</span></sc-if>
</div>
</div>
<sc-if value="{{it.hasPrice}}"><div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 0 14px">
<span style="font-size: 15px; font-weight: 700">{{it.priceLabel}}</span>
<button aria-label="Добавить в корзину" onClick="{{it.add}}" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; box-shadow: 0 4px 12px rgba(51,85,240,0.28); display: flex; align-items: center; justify-content: center; cursor: pointer" type="button"><svg aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="M12 5v14M5 12h14"></path></svg></button>
</div></sc-if><sc-if value="{{it.noPrice}}"><div style="margin-top: auto; display: flex; padding: 0 8px">
<a href="{{it.href}}" style="flex: 1; height: 44px; border-radius: 999px; background: #E6EDFF; color: #2440C8; box-shadow: inset 0 0 0 1px #C9D6FF; display: flex; align-items: center; justify-content: center; padding: 0 12px; font-size: 14px; font-weight: 600; text-align: center; line-height: 1.15">Узнать цену</a>
</div></sc-if>
</article>
</sc-for>
</div>
</div>
</div>
</template>
<script type="text/x-dc-logic" data-dc="CategoryTablet" data-props='{"accent":{"editor":"color","default":"#3355F0","options":["#3355F0","#15161A","#E2572B","#1F7A55"]},"showMenu":{"editor":"boolean","default":false},"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
hdr() {
const st = this.state || {};
const open = st.menu ?? (this.props.showMenu ?? false);
const cur = st.cur || 'RUB';
const lang = st.lang || 'ru';
const item = 'width: 100%; min-height: 44px; padding: 0 10px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; color: #15161A; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; ';
const curList = [['RUB', '₽'], ['USD', '$'], ['EUR', '€'], ['KZT', '₸']];
const langList = [['ru', 'Русский', 'RU'], ['en', 'English', 'EN'], ['de', 'Deutsch', 'DE'], ['zh', '中文', 'ZH']];
const on = 'background: #F4F3EF; font-weight: 600';
const off = 'background: transparent; font-weight: 500';
const curs = curList.map(([code, sym]) => ({ code, sym, sel: code === cur, style: item + (code === cur ? on : off), pick: () => this.setState({ cur: code }) }));
const langs = langList.map(([id, name]) => ({ name, sel: id === lang, style: item + (id === lang ? on : off), pick: () => this.setState({ lang: id }) }));
return {
menuOpen: open,
menuExpanded: open ? 'true' : 'false',
toggleMenu: () => this.setState({ menu: !open }),
curs, langs,
curSym: curList.find((c) => c[0] === cur)[1],
langCode: langList.find((l) => l[0] === lang)[2],
globeStyle: 'height: 44px; padding: 0 10px 0 12px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; ' + (open ? 'background: #15161A; color: #FFFFFF' : 'background: #F4F3EF; color: #15161A'),
chevStyle: 'transition: transform .2s; transform: rotate(' + (open ? '180' : '0') + 'deg)'
};
}

renderVals() {
return Object.assign({ accent: this.props.accent ?? '#3355F0', icBox: this.icPalette() }, this.hdr(), P.catVals(this, 'Tablet'));
}
}
P.mix(Component);
</script>
<script src="catalog.js"></script>
<script src="proto-logic.js"></script>
<script src="dc-runtime.js"></script>
<script>DC.boot("CategoryTablet")</script>
</body>
</html>
