<p style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 400; color: #4A4C52; text-wrap: pretty">Иван Иванович, благодарим за выбор! Подтверждение бронирования отправили на <strong style="font-weight: 600; color: var(--tx)">ivanov_ivan@guest.mail</strong></p>

-radius: 7px"></span></span><span class="sk" style="display: block; flex: none; width: 64px; height: 18px; border-radius: 8px"></span></div></div></div></sc-if>
</div>
</template>
